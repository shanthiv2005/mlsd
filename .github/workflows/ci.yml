name: "CI — Test and Build"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Upload models folder
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/

      - name: Build Docker image
        run: |
          cp models/scaler.pkl scaler.pkl 2>/dev/null || touch scaler.pkl
          docker build -t fraud-detection:latest .

      - name: CI complete
        run: echo "CI complete — tests passed, Docker image built"
